<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut,user-scalable=no">
<meta name="theme-color" content="#18181B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NST">
<title>NST 팀 매니저</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
:root{--bg:#FBFAF7;--bg2:#F4EFE9;--card:#FFFFFF;--ink:#09090B;--sub:#71717A;--line:#E5DFD4;--soft:#FBF9F4;--red:#B91C1C;--red2:#7F1D1D;--redbg:#FBECEA;--blk:#18181B;--char:#3F3F46;--silver:#A1A1AA;--silverbg:#F1EFEB;--grn:#B91C1C;--shadow:none}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","Pretendard Variable","Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:14px;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
body{background:linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--blk);color:#fff;border-bottom:2px solid var(--red)}
.top img{width:34px;height:34px;object-fit:contain}
.brand{font-weight:800;letter-spacing:.5px;font-size:17px}.brand span{font-weight:500;color:var(--silver);font-size:12px;margin-left:4px}
.spacer{flex:1}
.ghost{background:transparent;border:1px solid #444;color:#ddd;border-radius:8px;padding:6px 10px;font-size:12px}
main{width:100%;margin:0;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
@media(min-width:700px){main{padding:16px 20px 40px}}
.tabs{position:fixed;top:0;bottom:0;left:0;width:232px;z-index:45;display:flex;flex-direction:column;gap:2px;background:var(--card);border-right:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 10px 14px;transform:translateX(-100%);transition:transform .2s ease;box-shadow:4px 0 18px rgba(0,0,0,.08)}
.tabs.open{transform:none}
.tabs .navlogo{display:flex;align-items:center;gap:8px;padding:4px 10px 14px;font-weight:800}.tabs .navlogo img{width:30px}
.tabs button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-left:3px solid transparent;border-radius:0 10px 10px 0;padding:12px 14px;font-size:15px;font-weight:600;color:var(--sub)}
.tabs button b{width:18px;text-align:center;font-size:16px}
.tabs button.on{border-left-color:var(--red);background:var(--soft);color:var(--ink)}
.tabs button:hover{background:var(--soft)}
.tabs .navsp{flex:1}.tabs .navset{border-top:1px solid var(--line);border-radius:0;margin-top:6px;padding-top:14px}
.navback{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:44;display:none}.navback.on{display:block}
.burger{background:none;border:0;color:#fff;font-size:22px;line-height:1;padding:2px 4px}
@media(min-width:900px){
 .tabs{top:52px;transform:none;width:200px;box-shadow:none;background:rgba(251,250,247,.75);padding-top:16px}
 .tabs .navlogo{display:none}
 .navback,.burger{display:none!important}
 main{margin-left:200px;width:auto}
 .toast{left:calc(50% + 100px)}
}

h2{font-size:19px;margin:4px 0 12px}h3{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(30%,140px),1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:11px;color:var(--sub)}.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}.kpi .s{font-size:11px;color:var(--sub)}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}.btn.dk{background:var(--blk);border-color:var(--blk);color:#fff}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}.btn.danger{color:var(--red);border-color:var(--red)}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--blk);color:#fff}

.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.t-tourn{background:var(--redbg);color:var(--red2)}.t-away{background:var(--silverbg);color:var(--char)}
.rw{background:var(--red);color:#fff}.rl{background:var(--silverbg);color:var(--char)}.rd{background:var(--silverbg);color:var(--sub)}
.tscroll{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
.tscroll::-webkit-scrollbar{width:12px;height:12px}.tscroll::-webkit-scrollbar-thumb{background:#666;border-radius:6px;border:2px solid var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--char);color:#fff;font-size:12px;font-weight:700;cursor:pointer;z-index:1}
th.sorted{background:var(--red)}
td.nm,th.nm{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}th.nm{background:var(--char);z-index:2}
td.c,th.c{text-align:center}
tr.click{cursor:pointer}tr.click:hover td{filter:brightness(.97)}
.pos{display:inline-block;min-width:26px;text-align:center;font-size:11px;font-weight:800;border-radius:5px;padding:1px 4px}
.pos-G{background:#F1EFEB;color:#3F3F46}.pos-F{background:#F6E3E0;color:#9A2A20}.pos-C{background:#18181B;color:#fff}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;position:relative;overflow:hidden}
.pc .num{position:absolute;right:8px;top:2px;font-size:40px;font-weight:900;color:var(--red);opacity:.16}
.pc .n{font-size:16px;font-weight:800}.pc .m{font-size:12px;color:var(--sub);margin-top:6px}
.avatar{width:62px;height:62px;border-radius:50%;background:var(--blk);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;border:3px solid var(--red);flex:none}
.note{font-size:12px;color:var(--sub);line-height:1.5}
.banner{background:var(--redbg);border:1px solid #EBC9C4;color:var(--red2);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13px}

.glist .gi{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.gi .sc{font-weight:800;font-size:16px;margin-left:auto;font-variant-numeric:tabular-nums}
.chart{width:100%;height:280px}
.court-wrap{position:relative;max-width:520px;margin:0 auto}
.court-wrap canvas{width:100%;display:block;border-radius:10px;touch-action:manipulation}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 28px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
label.f{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink);font:inherit}
input[type=range]{padding:0}
.toast{font-weight:600;position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--blk);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;border-left:4px solid var(--red)}
.toast.on{opacity:1}
/* live */
.score{display:flex;align-items:center;justify-content:center;gap:16px;background:var(--blk);border-bottom:3px solid var(--red);color:#fff;border-radius:14px;padding:12px;margin-bottom:10px}
.score .t{text-align:center}.score .t small{display:block;color:#aaa;font-size:11px}.score .t b{font-size:34px;font-variant-numeric:tabular-nums}
.score .vs{color:#666;font-weight:800}
.qbar{display:flex;gap:6px;margin-bottom:10px}.qbar button{flex:1;padding:8px 0;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:800}
.qbar button.on{background:var(--red);border-color:var(--red);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-bottom:10px}
.pb{border:2px solid var(--line);background:var(--card);border-radius:11px;padding:7px 4px;text-align:center;position:relative}
.pb .nn{font-weight:800;font-size:14px}.pb .no{font-size:11px;color:var(--sub)}
.pb.court{border-color:var(--blk);background:var(--soft)}
.pb.court::after{content:"코트";position:absolute;top:-7px;left:6px;font-size:9px;background:var(--blk);color:#fff;padding:0 4px;border-radius:4px}
.pb.sel{border-color:var(--red);background:var(--red);color:#fff}.pb.sel .no{color:#ffd}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
@media(max-width:380px){.ab{font-size:13px;min-height:50px}}
.ab{min-height:54px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:14px;line-height:1.15}
.ab small{display:block;font-size:10px;font-weight:600;opacity:.75}
.ab.mk{background:var(--red);border-color:var(--red);color:#fff}.ab.ms{background:#fff;border-color:var(--silver);color:var(--char)}

.ab.opp{background:var(--char);border-color:var(--char);color:#fff}
.ab:active{transform:scale(.96)}
.onums{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.onum{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 4px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.onum b{font-size:20px;font-weight:900}.onum small{font-size:11px;color:var(--sub)}
.onum.f4{border-color:var(--red);background:var(--redbg)}.onum.fout{opacity:.45;border-style:dashed}
.fctiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.fct{background:var(--blk);color:#fff;border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:2px}
.fct small{font-size:12px;color:#d4d4d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fct b{font-size:44px;font-weight:900;line-height:1.05}.fct span{font-size:11px;color:#a1a1aa}
.fct.pt{background:#fff;color:var(--ink);border:1px solid var(--line)}.fct.pt small,.fct.pt span{color:var(--sub)}
.fct.bonus{background:var(--red)}.fct.bonus span,.fct.bonus small{color:#fff}
.fqh{margin-bottom:10px}.fq h3 small{font-size:12px;color:var(--sub);font-weight:700}.fbh{margin-top:12px}
.frow{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.fslot{flex:0 1 230px;min-width:0;border-radius:12px}.fslot.fdrop{outline:2px dashed var(--red);outline-offset:2px;background:var(--redbg)}
.fempty{border:1.5px dashed var(--line);border-radius:12px;min-height:86px;height:100%;display:flex;align-items:center;justify-content:center;color:var(--silver);font-size:12px}
.fpc{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px;height:100%}
.fph{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:6px}.fph b{font-size:14px;font-weight:800;white-space:nowrap}.fph i{font-style:normal;color:var(--sub);font-size:12px}.fph span{font-size:12px;color:var(--sub);white-space:nowrap}.fph em{font-style:normal;font-size:17px;font-weight:900;color:var(--ink)}.fph u{text-decoration:none;font-weight:800}
.fph b>i:last-child{color:var(--silver);margin-left:2px}
.fpb{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:5px}.fpb button{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:9px 0;font:inherit;font-weight:800;font-size:14px;cursor:pointer;touch-action:manipulation}.fpb button:active{transform:scale(.95)}.fpb .fl{background:var(--char);border-color:var(--char);color:#fff;font-size:13px}
.fpc.f4{border-color:var(--red);background:var(--redbg)}.fpc.f4 u{color:var(--red)}.fpc.fout{border-style:dashed;background:var(--silverbg)}.fpc.fout u{color:var(--red)}
.fpc.swap{border-color:var(--red);box-shadow:0 0 0 2px var(--redbg)}.fpc.swap .fph b>i:last-child{color:var(--red)}
.fph[data-fdrag],.fbc,.fcb[data-odrag]{touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.fdragging{opacity:.35}
.fzone{min-height:40px;border-radius:12px}.fzone.fdrop{background:var(--redbg);outline:2px dashed var(--red);outline-offset:3px}
.fed{cursor:pointer;border-bottom:1px dashed var(--silver);padding-bottom:1px}
.fer{display:flex;align-items:center;gap:10px;margin:12px 0}.fer span{width:44px;font-weight:800}.fer button{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-size:28px;font-weight:800;cursor:pointer;touch-action:manipulation}.fer input{flex:1;min-width:0;text-align:center;font-size:30px;font-weight:900;padding:8px}
.fbench{display:flex;flex-wrap:wrap;gap:8px}
.fbc{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 12px;font:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.fbc b{font-size:14px;font-weight:800}.fbc b i{font-style:normal;color:var(--sub);font-size:12px}.fbc span{font-size:12px;color:var(--sub)}.fbc u{text-decoration:none;font-weight:800;color:var(--ink)}
.fbc.sel{border-color:var(--red);background:var(--redbg)}.fbc.f4{border-color:var(--red)}.fbc.f4 u,.fbc.fout u{color:var(--red)}.fbc.fout{border-style:dashed;background:var(--silverbg)}
.fghost{position:fixed;z-index:999;transform:translate(-50%,-130%);background:var(--blk);color:#fff;padding:8px 14px;border-radius:10px;font-weight:800;font-size:14px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fopr{margin-bottom:10px;gap:8px;flex-wrap:nowrap}.fopr input{min-width:0}.fopr .fopp{flex:1 1 0;font-weight:800}.fopr #fcIn{flex:1.3 1 0}
.fcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.fcb{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.fcb:active{transform:scale(.96)}.fcb i{font-style:normal;font-size:11px;color:var(--sub)}.fcb b{font-size:14px;font-weight:800}.fcb em{font-style:normal;font-size:15px;font-weight:900}.fcb small{font-size:10px;color:var(--sub)}
.fcb.f4{border-color:var(--red);background:var(--redbg)}.fcb.f4 em{color:var(--red)}.fcb.fout{border-style:dashed;background:var(--silverbg);color:var(--sub)}
.fcw{position:relative}.fcx{position:absolute;top:2px;right:2px;border:0;background:none;color:var(--silver);font-size:12px;padding:4px;cursor:pointer}
.fcw.fdrop .fcb{outline:2px solid var(--red);background:var(--redbg)}
/* 폰: 한 화면에 코트·벤치·상대가 다 보이게 압축 */
@media(max-width:699px){
 .fq .fqh h2,.fq .hint:not(.keep),.fq>.note{display:none}.fq .fqh{margin-bottom:6px;gap:6px}
 .fq .fctiles{gap:6px;margin-bottom:6px}.fq .fct{padding:5px 4px;border-radius:10px;gap:0}.fq .fct small{font-size:10px}.fq .fct b{font-size:24px}.fq .fct span{display:none}
 .fq .card{padding:8px;margin-bottom:6px}.fq h3{font-size:13px;margin:0 0 5px}.fq .fbh{margin-top:6px}
 .fq .frow{gap:5px;margin-bottom:5px}.fq .fslot{flex:0 0 calc((100% - 10px)/3)}.fq .fempty{min-height:98px;font-size:11px}
 .fq .fpc{padding:5px}.fq .fph{flex-direction:column;align-items:flex-start;gap:0;margin-bottom:4px}.fq .fph b{font-size:13px}.fq .fph span{font-size:11px}.fq .fph em{font-size:14px}
 .fq .fpb{grid-template-columns:1fr 1fr;gap:4px}.fq .fpb button{padding:7px 0;font-size:13px;border-radius:8px}.fq .fpb .fl{font-size:12px}
 .fq .fbench{gap:5px}.fq .fbc{padding:5px 8px;flex-direction:row;align-items:baseline;gap:5px;border-radius:9px}.fq .fbc b{font-size:13px}.fq .fbc span{font-size:11px}
 .fq .fopr{margin-bottom:6px;gap:5px}.fq .fopr input{padding:7px 8px;font-size:13px}.fq .fopr .btn{padding:7px 10px}
 .fq .ogrid{grid-template-columns:repeat(5,1fr);gap:5px}.fq .fcb{padding:5px 2px;border-radius:9px;gap:0}.fq .fcb>i,.fq .fcb small{display:none}.fq .fcw .fcb b{font-size:17px!important}.fq .fcb em{font-size:12px}.fq .fcx{font-size:10px;padding:2px 3px;top:0;right:0}
}
/* 탭 세로: 크게 */
@media(min-width:700px) and (orientation:portrait){
 .fctiles{gap:14px;margin-bottom:16px}.fct{padding:16px 12px}.fct small{font-size:15px}.fct b{font-size:64px}.fct span{font-size:13px}
 .frow{gap:12px;margin-bottom:12px}.fslot{flex:0 0 calc((100% - 24px)/3)}.fempty{min-height:190px;font-size:15px}
 .fpc{padding:12px 10px}.fph{flex-direction:column;align-items:center;gap:4px;margin-bottom:10px}.fph b{font-size:19px}.fph span{font-size:14px}.fph em{font-size:34px}
 .fpb{grid-template-columns:1fr 1fr;gap:8px}.fpb button{padding:16px 0;font-size:21px;border-radius:12px}.fpb .fl{font-size:17px}
 .fbench{gap:10px}.fbc{padding:12px 18px;min-width:118px}.fbc b{font-size:17px}.fbc span{font-size:14px}
 .fcgrid{gap:10px}.fcb{padding:12px 4px}.fcb em{font-size:19px}.fcb small{font-size:12px}
 .fcw .fcb b{font-size:32px!important}.fcx{font-size:15px;padding:6px}
 .fopr input{font-size:17px;padding:13px}
 .ogrid{grid-template-columns:repeat(5,1fr)}
}
.aststrip{background:var(--redbg);border:1px solid #EBC9C4;border-radius:11px;padding:8px;margin-bottom:8px}

.log{max-height:260px;overflow:auto}.log div{display:flex;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.log .x{margin-left:auto;border:0;background:none;color:var(--red);font-weight:800}
.radar-tbl td{padding:5px 6px}.bar{height:7px;border-radius:4px;background:var(--red)}
.hint{font-size:11px;color:var(--sub)}
.shgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:10px}
.sh .sv{font-size:20px;font-weight:900;letter-spacing:-.02em}.sh.big .sv{font-size:28px;color:var(--red)}
.sbar{height:6px;background:var(--silverbg);border-radius:4px;margin:4px 0;overflow:hidden}.sbar i{display:block;height:100%;background:var(--red)}
@media(max-width:480px){.shgrid{grid-template-columns:1fr 1fr}}
.lbl{font-weight:800;font-size:13px;margin-bottom:6px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{min-height:78px;border:2px dashed var(--bd2,#D4CCBC);border-radius:12px;display:flex;align-items:stretch;justify-content:center;background:var(--soft)}
.slot .empty{align-self:center;font-size:11px;color:var(--silver)}
.slot.over,.bench.over{border-color:var(--red)!important;background:var(--redbg)}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px;border:2px dashed transparent;border-radius:12px;padding:2px;min-height:64px}
.chip{flex:1;touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 2px;text-align:center;cursor:grab;min-width:0}
.slot .chip{border-color:var(--blk)}
.chip .cn{font-size:19px;font-weight:900;line-height:1.05}
.chip .cm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cs{font-size:10px;color:var(--sub);white-space:nowrap}
.chip.sel{background:var(--red);border-color:var(--red);color:#fff}.chip.sel .cs{color:#fde}
.chip.f4{box-shadow:inset 0 -3px 0 var(--red)}.chip.fout{opacity:.45;border-style:dashed}
.ghostchip{position:fixed;pointer-events:none;z-index:70;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 10px 24px rgba(0,0,0,.25);background:var(--card)}
.pendbar{background:var(--blk);color:#fff;border-radius:12px;padding:12px;margin-bottom:12px;border-left:4px solid var(--red)}
.clkb{margin-top:4px;background:#2a2a2e;border:1px solid #444;color:#fff;border-radius:8px;padding:3px 8px;font-weight:800;font-variant-numeric:tabular-nums}
.ab:disabled{opacity:.35}
table.sheet td.q{min-width:46px}table.sheet td.q i{font-style:normal;color:var(--red);font-size:10px;margin-right:2px}table.sheet td.q s{text-decoration:none;color:var(--sub);font-size:10px;margin-left:3px}
table.sheet td.q.on{background:var(--soft)}table.sheet tr.tot td{background:var(--silverbg)}table.sheet .fo{color:var(--red);font-weight:800}

</style>

/* ============ 코트 구역 ============ */
function zoneOf(x,y){
 if(x<0||x>500||y<0||y>470)return null;
 const dx=x-250,dy=y-52,d=Math.hypot(dx,dy),a=Math.atan2(dx,dy)*180/Math.PI;
 const three=y<=197?(x<62||x>438):d>237.5;
 if(three){if(y<=197)return x<250?'3LC':'3RC';if(Math.abs(a)<22.5)return '3T';return dx<0?'3L45':'3R45'}
 if(x>=170&&x<=330&&y<=190)return 'PT';
 if(y<=140)return dx<0?'2LB':'2RB';
 if(Math.abs(a)<22.5)return '2T';return dx<0?'2L45':'2R45';
}
const ZMAP=(()=>{const m=new Int8Array(500*470);for(let y=0;y<470;y++)for(let x=0;x<500;x++){const z=zoneOf(x+.5,y+.5);m[y*500+x]=z?ZK.indexOf(z):-1}return m})();

function drawCourt(cv,o={}){
 cv.width=500;cv.height=470;const c=cv.getContext('2d');
 const img=c.createImageData(500,470),d=img.data,base=[246,240,230],col=o.color||[185,28,28];
 for(let i=0;i<ZMAP.length;i++){
  const zi=ZMAP[i];let r=base[0],g=base[1],b=base[2];
  const v=o.values&&zi>=0?o.values[ZK[zi]]:null;
  if(v!=null){const a=.08+.78*clamp(v,0,1);r=r*(1-a)+col[0]*a;g=g*(1-a)+col[1]*a;b=b*(1-a)+col[2]*a}
  const x=i%500;if((x<499&&ZMAP[i+1]!==zi)||(i+500<ZMAP.length&&ZMAP[i+500]!==zi)){r=g=b=255}
  d[i*4]=r;d[i*4+1]=g;d[i*4+2]=b;d[i*4+3]=255;
 }
 c.putImageData(img,0,0);
 c.strokeStyle='#2a2a2a';c.lineWidth=3;
 c.strokeRect(1.5,1.5,497,467);
 c.strokeRect(170,0,160,190);
 c.beginPath();c.arc(250,190,60,0,Math.PI);c.stroke();
 c.setLineDash([8,8]);c.beginPath();c.arc(250,190,60,Math.PI,2*Math.PI);c.stroke();c.setLineDash([]);
 c.beginPath();c.arc(250,52,40,0,Math.PI);c.stroke();
 c.beginPath();c.moveTo(220,40);c.lineTo(280,40);c.stroke();
 c.strokeStyle=css('--red')||'#e11d2e';c.beginPath();c.arc(250,52,7.5,0,2*Math.PI);c.stroke();c.strokeStyle='#2a2a2a';
 c.beginPath();c.moveTo(62,0);c.lineTo(62,197.1);c.arc(250,52,237.5,Math.atan2(145.1,-188),Math.atan2(145.1,188),true);c.lineTo(438,0);c.stroke();
 c.beginPath();c.arc(250,470,60,Math.PI,0);c.stroke();
 if(o.dots)o.dots.forEach(p=>{c.beginPath();c.arc(p.x,p.y,6,0,2*Math.PI);if(p.made){c.fillStyle='#B91C1C';c.fill()}else{c.strokeStyle='#3F3F46';c.lineWidth=2.5;c.moveTo(p.x-5,p.y-5);c.lineTo(p.x+5,p.y+5);c.moveTo(p.x+5,p.y-5);c.lineTo(p.x-5,p.y+5);c.stroke()}c.lineWidth=3});
 if(o.labels){c.textAlign='center';c.textBaseline='middle';
  for(const z of ZK){const L=o.labels[z];if(!L)continue;const Z=ZONES[z];const corner=z==='3LC'||z==='3RC';
   c.font='800 '+(corner?15:20)+'px Inter,"Pretendard Variable",sans-serif';c.lineWidth=4;c.strokeStyle='rgba(255,255,255,.9)';c.fillStyle='#111';
   const lines=String(L).split('\n');
   c.strokeText(lines[0],Z.lx,Z.ly);c.fillText(lines[0],Z.lx,Z.ly);
   if(lines[1]){c.font='600 12px Inter,"Pretendard Variable",sans-serif';c.strokeText(lines[1],Z.lx,Z.ly+18);c.fillStyle='#444';c.fillText(lines[1],Z.lx,Z.ly+18)}
  }}
 if(o.mark){c.beginPath();c.arc(o.mark.x,o.mark.y,9,0,2*Math.PI);c.fillStyle='rgba(185,28,28,.9)';c.fill()}
}

/* ============ 통계 ============ */
function score(g){let a=0,b=0;for(const e of g.events){const d=EV[e.type];if(d&&d.pts){if(d.opp)b+=d.pts;else a+=d.pts}}return[a,b]}
function qScore(g,q){let a=0,b=0;for(const e of g.events){if(e.q!==q)continue;const d=EV[e.type];if(d&&d.pts){if(d.opp)b+=d.pts;else a+=d.pts}}return[a,b]}
function maxQ(g){return Math.max(4,...g.events.map(e=>e.q),...Object.keys(g.lineup||{}).map(Number))}
function result(g){const[a,b]=score(g);return a>b?'W':a<b?'L':'D'}
function scoped(scope){return DB.games.filter(g=>scope==='all'||g.type===scope).sort((a,b)=>a.date<b.date?-1:1)}
function qCredit(g,pid,q){
 if(!(g.lineup&&g.lineup[q]&&g.lineup[q].includes(pid)))return 0;
 const evs=g.events.filter(e=>e.q===q),st=evs.find(e=>e.type==='QSTART');
 if(!st)return 1; // 교체 기록 없는 예전 경기 = 1Q
 const on=new Set(st.court||[]);const start=on.has(pid);
 for(const e of evs){if(e.type==='SUB'){if(e.out)on.delete(e.out);if(e.pid)on.add(e.pid)}if(e.type==='QEND')break}
 return start&&on.has(pid)?1:.5; // 시작·끝 모두 코트=1.0, 그 외 0.5
}
function fmtQ(v){if(v==null||isNaN(v))return'–';const r=Math.round(v*10)/10;return(Number.isInteger(r)?r:r.toFixed(1))+'Q'}
function calc(pid,games){
 const s={g:0,q:0,m2:0,a2:0,m3:0,a3:0,ftm:0,ftmT:0,ftaT:0,oreb:0,dreb:0,ast:0,stl:0,blk:0,tov:0,pf:0,pm:0};
 for(const g of games){
  let qs=0;for(const q in(g.lineup||{}))qs+=qCredit(g,pid,+q);
  const mine=g.events.some(e=>e.pid===pid);
  if(!qs&&!mine)continue;
  s.g++;s.q+=qs||1;
  for(const e of g.events){const d=EV[e.type];if(!d)continue;
   if(e.pid===pid&&!d.opp){switch(e.type){
    case'2PM':s.m2++;s.a2++;break;case'2PX':s.a2++;break;case'3PM':s.m3++;s.a3++;break;case'3PX':s.a3++;break;
    case'FTM':s.ftm++;if(g.type==='tourn'){s.ftmT++;s.ftaT++}break;case'FTX':s.ftaT++;break;
    case'OREB':s.oreb++;break;case'DREB':s.dreb++;break;case'AST':s.ast++;break;case'STL':s.stl++;break;case'BLK':s.blk++;break;case'TOV':s.tov++;break;case'PF':s.pf++;break}}
   if(d.pts&&(e.court||[]).includes(pid))s.pm+=d.opp?-d.pts:d.pts;
  }
 }
 s.fgm=s.m2+s.m3;s.fga=s.a2+s.a3;s.reb=s.oreb+s.dreb;s.pts=s.m2*2+s.m3*3+s.ftm;
 s.fgp=s.fga?s.fgm/s.fga:null;s.p2=s.a2?s.m2/s.a2:null;s.p3=s.a3?s.m3/s.a3:null;s.ftp=s.ftaT?s.ftmT/s.ftaT:null;
 const tsa=s.fga+.44*s.ftaT;s.ts=tsa?s.pts/(2*tsa):null;s.pmq=s.q?s.pm/s.q:null;s.qpg=s.g?s.q/s.g:null;
 return s;
}
const COUNT=['pts','fgm','fga','m2','a2','m3','a3','ftm','oreb','dreb','reb','ast','stl','blk','tov','pf','pm'];
function per(s,mode){const o={...s};let div=1;if(mode==='pg')div=s.g;else if(mode==='pq')div=s.q;else if(mode==='p4')div=s.q/4;if(mode!=='tot')COUNT.forEach(k=>o[k]=div?s[k]/div:0);return o}
function teamStats(games){
 const t={g:games.length,w:0,l:0,pf:0,pa:0,m2:0,a2:0,m3:0,a3:0,ftmT:0,ftaT:0,reb:0,ast:0,stl:0,blk:0,tov:0};
 for(const g of games){const[a,b]=score(g);t.pf+=a;t.pa+=b;if(a>b)t.w++;else if(a<b)t.l++;
  for(const e of g.events){switch(e.type){case'2PM':t.m2++;t.a2++;break;case'2PX':t.a2++;break;case'3PM':t.m3++;t.a3++;break;case'3PX':t.a3++;break;
   case'FTM':if(g.type==='tourn'){t.ftmT++;t.ftaT++}break;case'FTX':t.ftaT++;break;case'OREB':case'DREB':t.reb++;break;case'AST':t.ast++;break;case'STL':t.stl++;break;case'BLK':t.blk++;break;case'TOV':t.tov++;break}}}
 t.fgp=(t.a2+t.a3)?(t.m2+t.m3)/(t.a2+t.a3):null;t.p3=t.a3?t.m3/t.a3:null;t.ftp=t.ftaT?t.ftmT/t.ftaT:null;
 return t;
}
function pct(v){return v==null?'–':(v*100).toFixed(1)+'%'}
function num(v,mode){if(v==null)return'–';return mode==='tot'?String(Math.round(v)):v.toFixed(2)}
function sgn1(v){if(v==null)return'–';const t=v.toFixed(1);return v>0?'+'+t:t}
function sgn(v,mode){if(v==null)return'–';const s=mode==='tot'?String(Math.round(v)):v.toFixed(2);return v>0?'+'+s:s}

/* 레이더: 기록 기반 6각 (팀 내 상대평가, 출전 2Q 이상) */
function rawAxes(s){const q=s.q||1;return{score:s.pts/q,shoot:s.fga>=3?(s.ts||0):null,reb:s.reb/q,play:(s.ast-.5*s.tov)/q,def:(s.stl+s.blk)/q,impact:s.pm/q}}
function radarFor(pid){
 const pool=DB.players.filter(p=>p.active||p.id===pid).map(p=>({id:p.id,s:calc(p.id,DB.games)})).filter(x=>x.s.q>=2);
 const me=pool.find(x=>x.id===pid);if(!me)return null;
 const out={};
 for(const[k]of AX){const vals=pool.map(x=>rawAxes(x.s)[k]).filter(v=>v!=null);const mn=Math.min(...vals),mx=Math.max(...vals);const v=rawAxes(me.s)[k];
  out[k]={raw:v,score:v==null?30:Math.round(30+70*((v-mn)/((mx-mn)||1)))}}
 return out;
}

/* ============ 시드 (이미지 기반 선수 11명 + 샘플 경기) ============ */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seed(){
 const L=[['차재성','G'],['김상욱','C'],['오두환','F'],['문종배','F'],['서주원','F'],['윤홍석','C'],['박준택','C'],['장정민','F'],['한대영','F'],['김영재','G'],['지재준','G'],['김호현','G'],['강우영','G']];
 return{v:1,staff:[{role:'감독',name:'김성민'},{role:'주무',name:'조성훈'}],players:L.map(([name,pos])=>({id:uid(),name,num:'',pos,height:'',weight:'',active:true,memo:'',rate:null,legacy:null})),games:[]};
}
function genSample(players){
 const R=mulberry(20261104);
 const pickW=(arr,wf)=>{const ws=arr.map(wf);let r=R()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i]}return arr[arr.length-1]};
 const lg=p=>p.legacy||{};
 const z2=def=>pickW(['PT','2LB','2RB','2L45','2R45','2T'],z=>z==='PT'?(def?6:5):1);
 const z3=()=>pickW(['3LC','3RC','3L45','3R45','3T'],z=>z==='3T'?2.2:z.endsWith('C')?1:2);
 const ptIn=z=>{for(let i=0;i<4000;i++){const x=R()*500,y=R()*470;if(zoneOf(x,y)!==z)continue;if(z[0]==='3'&&!z.endsWith('C')&&Math.hypot(x-250,y-52)>320)continue;return{x:Math.round(x),y:Math.round(y)}}return{x:ZONES[z].lx,y:ZONES[z].ly}};
 const metas=[['2026-09-13','tourn','가을리그 1R','블랙호크스','구민체육관'],['2026-09-20','away','원정 연습경기','성수 BC','성수 야외코트'],['2026-10-04','tourn','가을리그 2R','레드윙즈','구민체육관'],['2026-10-18','away','원정 교류전','마포 크루','마포 실내코트'],['2026-10-25','tourn','가을리그 3R','썬더스','구민체육관']];
 return metas.map(([date,type,title,opp,venue])=>{
  const g={id:uid(),date,type,title,opp,venue,zones:type==='tourn',events:[],lineup:{},court:[],curQ:4,sample:true};
  const avail=players.slice().sort(()=>R()-.5).slice(0,8+Math.floor(R()*3));
  for(let q=1;q<=4;q++){
   const court=[],pool=avail.slice();
   while(court.length<5&&pool.length){const p=pickW(pool,p=>1+(lg(p).att||0)/4);court.push(p);pool.splice(pool.indexOf(p),1)}
   const cid=court.map(p=>p.id);g.lineup[q]=cid.slice();if(q===4)g.court=cid.slice();
   const push=(pid,t,z)=>{const e={id:uid(),q,pid,type:t,court:cid.slice()};if(z&&g.zones){const pt=ptIn(z);e.zone=z;e.x=pt.x;e.y=pt.y}g.events.push(e)};
   const poss=9+Math.floor(R()*4);
   for(let i=0;i<poss;i++){
    if(R()<.13)push(pickW(court,p=>.3+(lg(p).tov||0)).id,'TOV');
    else{const sh=pickW(court,p=>1.5+(lg(p).att||0)),L=lg(sh);const three=R()<(L.p3>0?.4:.15);
     const pc=three?clamp((L.p3||22)/100,.18,.42):clamp((L.p2||L.made||35)/100,.3,.55);const made=R()<pc;
     push(sh.id,(three?'3P':'2P')+(made?'M':'X'),three?z3():z2());
     if(made&&R()<.45){const o=court.filter(p=>p!==sh);push(pickW(o,p=>.5+(lg(p).ast||0)).id,'AST')}
     if(!made&&R()<.28){const rb=pickW(court,p=>1+(lg(p).reb||0));push(rb.id,'OREB');if(R()<.5){const m2=R()<.5;push(rb.id,m2?'2PM':'2PX','PT')}}
     if(R()<.08){if(type==='tourn'){push(sh.id,R()<.6?'FTM':'FTX');push(sh.id,R()<.6?'FTM':'FTX')}else push(sh.id,'FTM')}}
    if(R()<.1)push(pickW(court,p=>.3+(lg(p).stl||0)).id,'STL');
    else{const three=R()<.33,made=R()<(three?.3:.46),z=three?z3():z2(true);
     if(made)push(null,three?'OPP3':'OPP2',z);else{push(null,'OPPX',z);if(R()<.08)push(pickW(court,p=>p.pos==='C'?3:1).id,'BLK');if(R()<.72)push(pickW(court,p=>1+(lg(p).reb||0)).id,'DREB')}
     if(R()<.05)push(null,'OPP1')}
    if(R()<.12)push(pickW(court,p=>.5+(lg(p).fl||0)).id,'PF');
   }
  }
  return g;
 });
}

/* ── 간편 기록: NST 득점·파울 + 상대 파울 (경기 기록과 별개) ── */
function FC(){if(!DB.foul)DB.foul={opp:'',q:1,nums:[],ev:[]};return DB.foul}
function fcPts(id,q){return FC().ev.filter(e=>e.t==='P'&&(id==null||e.id===id)&&(q==null||e.q===q)).reduce((t,e)=>t+e.v,0)}
function fcPt(id,v){const f=FC();f.ev.push({side:'us',id,q:f.q,t:'P',v});save();toast(`${(P(id)||{}).name} +${v} · ${fcPts(id)}점 (NST ${fcPts()}점)`);render()}
function fcCnt(side,id,q){return FC().ev.filter(e=>e.t!=='P'&&e.side===side&&(id==null||e.id===id)&&(q==null||e.q===q)).length}
function fcAdd(side,id){const f=FC();f.ev.push({side,id,q:f.q});save();const n=fcCnt(side,id),tf=fcCnt(side,null,f.q);
 const who=side==='us'?(P(id)||{}).name:(f.opp||'상대')+' #'+id;
 toast(`${who} 파울 ${n}개${n>=FOUL_OUT?' — 퇴장':n===FOUL_OUT-1?' — 4개 주의':''} · 팀파울 ${tf}${tf>=5?' (보너스)':''}`);render()}
function fcCourt(){const f=FC(),ok=id=>id&&DB.players.some(p=>p.id===id&&p.active);let c=(f.court||[]).slice(0,5).map(id=>ok(id)?id:null);while(c.length<5)c.push(null);f.court=c;return c}
function fcMove(pid,to,slot){const c=fcCourt(),on=c.indexOf(pid);
 if(to==='bench'){if(on>=0)c[on]=null}
 else if(slot!=null){const t=c[slot];if(on>=0)c[on]=t;c[slot]=pid}
 else if(on<0){const e=c.indexOf(null);if(e>=0)c[e]=pid;else{S.fcPick=pid;toast('코트가 5명이에요 — 바꿀 선수 이름을 탭하세요');render();return}}
 S.fcPick=null;save();render()}
function fcTap(pid){if(S.fcSkip){S.fcSkip=0;return}const c=fcCourt(),on=c.indexOf(pid);
 if(on>=0){if(S.fcPick)fcMove(S.fcPick,'court',on);else fcMove(pid,'bench')}
 else if(S.fcPick===pid){S.fcPick=null;render()}else fcMove(pid,'court')}
function fcSlotTap(i){if(S.fcPick)fcMove(S.fcPick,'court',i)}
/* 끌기: 마우스=바로, 터치=길게 눌러야 시작 (스크롤과 안 엉키게) */
function fcDrag(el,label,hl,drop){let gh=null,tm=null;
 const begin=(x,y,id)=>{gh=document.createElement('div');gh.className='fghost';gh.textContent=label;gh.style.left=x+'px';gh.style.top=y+'px';document.body.appendChild(gh);el.classList.add('fdragging');try{el.setPointerCapture(id)}catch(_){}try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}};
 const unhl=()=>document.querySelectorAll('.fdrop').forEach(x=>x.classList.remove('fdrop'));
 el.addEventListener('touchmove',e=>{if(gh)e.preventDefault()},{passive:false});
 el.addEventListener('contextmenu',e=>e.preventDefault());
 el.onpointerdown=e=>{if(e.button)return;const sx=e.clientX,sy=e.clientY,mouse=e.pointerType==='mouse';gh=null;
  if(!mouse)tm=setTimeout(()=>{tm=null;begin(sx,sy,e.pointerId)},280);
  const mv=m=>{const d=Math.hypot(m.clientX-sx,m.clientY-sy);
   if(!gh){if(mouse){if(d<8)return;begin(m.clientX,m.clientY,e.pointerId)}else{if(d>10&&tm){clearTimeout(tm);tm=null}return}}
   gh.style.left=m.clientX+'px';gh.style.top=m.clientY+'px';unhl();const z=hl(m.clientX,m.clientY);if(z)z.classList.add('fdrop')};
  const up=u=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);clearTimeout(tm);tm=null;el.classList.remove('fdragging');unhl();
   if(!gh)return;gh.remove();gh=null;S.fcSkip=1;setTimeout(()=>S.fcSkip=0,350);if(u.type==='pointerup')drop(u.clientX,u.clientY);else render()};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}}
function fcBind(){const at=(x,y,sel)=>{const t=document.elementFromPoint(x,y);return t&&t.closest(sel)};
 document.querySelectorAll('[data-fdrag]').forEach(el=>{const pid=el.dataset.fdrag;
  fcDrag(el,(P(pid)||{}).name,(x,y)=>at(x,y,'[data-fslot]')||at(x,y,'[data-fzone="bench"]'),(x,y)=>{const sl=at(x,y,'[data-fslot]'),bz=at(x,y,'[data-fzone="bench"]');
   if(sl)fcMove(pid,'court',+sl.dataset.fslot);else if(bz&&fcCourt().includes(pid))fcMove(pid,'bench');else render()})});
 document.querySelectorAll('[data-odrag]').forEach(el=>{const n=el.dataset.odrag;
  fcDrag(el,'#'+n,(x,y)=>{const c=at(x,y,'[data-ocard]');return c&&c.dataset.ocard!==n?c:null},(x,y)=>{const c=at(x,y,'[data-ocard]'),f=FC();
   if(c&&c.dataset.ocard!==n){const a=f.nums.indexOf(n),b=f.nums.indexOf(c.dataset.ocard);if(a>=0&&b>=0){[f.nums[a],f.nums[b]]=[f.nums[b],f.nums[a]];save()}}render()})})}
function fcEdit(side,id){if(S.fcSkip){S.fcSkip=0;return}const f=FC(),us=side==='us',nm=us?(P(id)||{}).name:(f.opp||'상대')+' #'+id;
 const row=(k,lab,v)=>`<div class="fer"><span>${lab}</span><button onclick="fcStep('${k}',-1)">−</button><input id="fe_${k}" inputmode="numeric" value="${v}"><button onclick="fcStep('${k}',1)">+</button></div>`;
 openModal(`<h3>${esc(nm)} 수정</h3>${us?row('P','득점',fcPts(id)):''}${row('F','파울',fcCnt(side,id))}
 <p class="note">바뀐 만큼은 지금 쿼터(${f.q<5?f.q+'Q':'OT'})에 더하거나 빼요.</p>
 <div class="row" style="margin-top:10px"><button class="btn pri" onclick="fcEditOk('${side}','${id}')">확인</button><button class="btn" onclick="closeModal()">취소</button></div>`)}
function fcStep(k,d){const i=document.getElementById('fe_'+k);i.value=Math.max(0,(parseInt(i.value)||0)+d)}
function fcEditOk(side,id){const f=FC(),val=k=>{const i=document.getElementById('fe_'+k);return i?Math.max(0,parseInt(i.value)||0):null};
 const take=(match,amt,isPt)=>{for(let i=f.ev.length-1;i>=0&&amt>0;i--){const e=f.ev[i];if(!match(e))continue;if(isPt){if(e.v<=amt){amt-=e.v;f.ev.splice(i,1)}else{e.v-=amt;amt=0}}else{amt--;f.ev.splice(i,1)}}};
 const nf=val('F'),cf=fcCnt(side,id);if(nf>cf)for(let i=0;i<nf-cf;i++)f.ev.push({side,id,q:f.q});else if(nf<cf){const m=e=>e.t!=='P'&&e.side===side&&e.id===id;let d=cf-nf;const inQ=f.ev.filter(e=>m(e)&&e.q===f.q).length,a=Math.min(d,inQ);take(e=>m(e)&&e.q===f.q,a);take(m,d-a)}
 const np=val('P');if(np!=null){const cp=fcPts(id);if(np>cp)f.ev.push({side:'us',id,q:f.q,t:'P',v:np-cp});else if(np<cp){const m=e=>e.t==='P'&&e.id===id;let d=cp-np;const inQ=f.ev.filter(e=>m(e)&&e.q===f.q).reduce((t,e)=>t+e.v,0),a=Math.min(d,inQ);take(e=>m(e)&&e.q===f.q,a,1);take(m,d-a,1)}}
 save();closeModal();toast('수정했어요');render()}
function fcUndo(){const f=FC();if(!f.ev.length){toast('취소할 기록이 없어요');return}const e=f.ev.pop();toast('취소: '+(e.side==='us'?(P(e.id)||{}).name:'상대 #'+e.id)+' '+(e.t==='P'?'+'+e.v:'파울'));save();render()}
function fcQ(q){FC().q=+q;save();render()}
function fcNums(){const f=FC(),i=document.getElementById('fcIn'),ns=parseNums(i.value);if(!ns.length){toast('등번호를 입력하세요');return}f.nums=[...new Set([...f.nums,...ns])];save();render();setTimeout(()=>{const x=document.getElementById('fcIn');if(x)x.focus()},30)}
function fcDelNum(n){const f=FC();if(fcCnt('opp',n)&&!confirm('#'+n+' 파울 기록도 같이 지울까요?'))return;f.nums=f.nums.filter(x=>x!==n);f.ev=f.ev.filter(e=>!(e.side==='opp'&&e.id===n));save();render()}
function fcReset(){if(!confirm('간편 기록을 전부 지우고 새로 시작할까요? (상대 번호 포함)'))return;DB.foul={opp:'',q:1,nums:[],ev:[]};save();render()}
function vFoul(v){const f=FC(),q=f.q,ut=fcCnt('us',null,q),ot=fcCnt('opp',null,q);
 const ps=DB.players.filter(p=>p.active).sort((x,y)=>(+x.num||99)-(+y.num||99)||x.name.localeCompare(y.name));
 const ct=fcCourt(),bn=ps.filter(p=>!ct.includes(p.id)),pick=S.fcPick&&bn.some(p=>p.id===S.fcPick)?S.fcPick:(S.fcPick=null),on=ct.filter(Boolean).length;
 const cls=n=>n>=FOUL_OUT?'fout':n>=FOUL_OUT-1?'f4':'';
 const qd=(side,id)=>[1,2,3,4,5].map(k=>fcCnt(side,id,k)).map((c,i)=>c?`${i<4?i+1+'Q':'OT'} ${c}`:'').filter(Boolean).join(' · ');
 const tile=(nm,n)=>`<div class="fct ${n>=5?'bonus':''}"><small>${esc(nm)} 팀파울</small><b>${n}</b><span>${n>=5?'보너스 · 자유투':'5개부터 보너스'}</span></div>`;
 const slot=i=>{const p=ct[i]?P(ct[i]):null;if(!p)return`<div class="fslot" data-fslot="${i}"><div class="fempty" onclick="fcSlotTap(${i})">빈 자리</div></div>`;
  const n=fcCnt('us',p.id),pt=fcPts(p.id);return`<div class="fslot" data-fslot="${i}"><div class="fpc ${cls(n)} ${pick?'swap':''}"><div class="fph" data-fdrag="${p.id}" onclick="fcTap('${p.id}')"><b>${p.num!==''?'<i>'+p.num+'</i> ':''}${esc(p.name)} <i>${pick?'⇄':'↓'}</i></b><span class="fed" onclick="event.stopPropagation();fcEdit('us','${p.id}')"><em>${pt}</em>점 · <u>F${n}${n>=FOUL_OUT?' 퇴장':''}</u></span></div><div class="fpb">${[1,2,3].map(k=>`<button onclick="fcPt('${p.id}',${k})">+${k}</button>`).join('')}<button class="fl" onclick="fcAdd('us','${p.id}')">파울</button></div></div></div>`};
 v.innerHTML=`<div class="fq"><div class="row fqh"><h2 style="margin:0">간편 기록</h2>${seg(String(q),{1:'1Q',2:'2Q',3:'3Q',4:'4Q',5:'OT'},'fcQ')}<div style="flex:1"></div><button class="btn sm" onclick="fcUndo()">↶ 취소</button><button class="btn sm" onclick="fcReset()">새로</button></div>
 <div class="fctiles"><div class="fct pt"><small>NST 득점</small><b>${fcPts()}</b><span>${q<5?q+'Q':'OT'} ${fcPts(null,q)}점</span></div>${tile('NST',ut)}${tile(f.opp||'상대',ot)}</div>
 <div class="card"><h3>코트 <small>${on}/5</small> <span class="hint">위 2 = 앞선 · 아래 3 = 뒷선 · 이름 탭 = 벤치로 · 길게 눌러 끌기</span></h3>
  <div class="frow">${slot(0)}${slot(1)}</div><div class="frow">${slot(2)}${slot(3)}${slot(4)}</div>
  <h3 class="fbh">벤치 ${pick?`<span class="hint keep"><b style="color:var(--red)">${esc((P(pick)||{}).name)}</b> 들어갈 차례 — 바꿀 선수 이름을 탭 · <a href="#" onclick="S.fcPick=null;render();return false">취소</a></span>`:'<span class="hint">탭 = 빈 자리로 · 길게 눌러 원하는 칸에 끌기</span>'}</h3>
  <div class="fbench fzone" data-fzone="bench">${bn.map(p=>{const n=fcCnt('us',p.id),pt=fcPts(p.id);return`<button class="fbc ${cls(n)} ${pick===p.id?'sel':''}" data-fdrag="${p.id}" onclick="fcTap('${p.id}')"><b>${p.num!==''?'<i>'+p.num+'</i> ':''}${esc(p.name)}</b><span class="fed" onclick="event.stopPropagation();fcEdit('us','${p.id}')">${pt}점 · <u>F${n}${n>=FOUL_OUT?' 퇴장':''}</u></span></button>`}).join('')||'<span class="hint keep">벤치 없음</span>'}</div></div>
 <div class="card"><div class="row fopr"><input class="fopp" placeholder="상대팀 이름" value="${esc(f.opp)}" onchange="FC().opp=this.value.trim();save();render()"><input id="fcIn" inputmode="numeric" placeholder="등번호 (4 7 11 23)" onkeydown="if(event.key==='Enter')fcNums()"><button class="btn pri" onclick="fcNums()">추가</button></div>
  <div class="fcgrid ogrid">${f.nums.map(n=>{const c=fcCnt('opp',n);return`<div class="fcw" data-ocard="${n}"><button class="fcb ${cls(c)}" data-odrag="${n}" onclick="if(S.fcSkip){S.fcSkip=0;return}fcAdd('opp','${n}')"><i>#</i><b style="font-size:22px">${n}</b><em class="fed" onclick="event.stopPropagation();fcEdit('opp','${n}')">F${c}${c>=FOUL_OUT?' 퇴장':''}</em><small>${qd('opp',n)||'&nbsp;'}</small></button><button class="fcx" onclick="fcDelNum('${n}')">✕</button></div>`}).join('')||'<span class="hint keep">상대 등번호를 입력해서 추가하세요 · 탭 = 파울 +1</span>'}</div></div>
 <p class="note">팀파울은 쿼터마다 따로 세요. 득점·개인 파울은 경기 전체 누적이고 파울 5개 = 퇴장이에요. 상대 번호는 길게 눌러 끌면 자리가 바뀌어요.</p></div>`;
 fcBind();
}
function mkChart(id,opt){const el=document.getElementById(id);if(!el||!window.echarts)return;const c=echarts.init(el);
 const ink=css('--ink'),sub=css('--sub'),line=css('--line');
 opt=Object.assign({textStyle:{color:ink,fontFamily:'Inter,"Pretendard Variable",sans-serif'},color:['#B91C1C','#3F3F46','#A1A1AA','#7F1D1D']},opt);
 [].concat(opt.xAxis||[],opt.yAxis||[]).forEach(a=>{a.axisLabel=Object.assign({color:sub},a.axisLabel);a.splitLine=Object.assign({lineStyle:{color:line}},a.splitLine);a.axisLine=Object.assign({lineStyle:{color:line}},a.axisLine)});
 if(opt.legend)opt.legend.textStyle=Object.assign({color:ink},opt.legend.textStyle);
 c.setOption(opt);charts.push(c);return c}
window.addEventListener('resize',()=>charts.forEach(c=>c.resize()));
function seg(cur,opts,fn){return`<div class="seg">${Object.entries(opts).map(([k,n])=>`<button class="${cur===k?'on':''}" onclick="${fn}('${k}')">${n}</button>`).join('')}</div>`}

 const games=scoped('all'),t=teamStats(games),samples=DB.games.filter(g=>g.sample).length;
 const act=DB.players.filter(p=>p.active);
 const ldr=k=>act.map(p=>({p,s:per(calc(p.id,games),'pg')})).filter(x=>x.s.g>0).sort((a,b)=>b.s[k]-a.s[k]).slice(0,3);

 </div>
 <div class="card"><h3>경기별 득점 · 실점</h3><div id="chTrend" class="chart"></div></div>

 mkChart('chTrend',{tooltip:{trigger:'axis'},legend:{top:0,data:['NST','상대']},grid:{left:36,right:16,top:34,bottom:30},

 <div class="card glist">${list.map(gameRow).join('')||'<div class="note">경기를 추가해 주세요</div>'}</div>`;

function newGame(){gameForm(null)}
function oppRecord(name){const gs=DB.games.filter(g=>g.opp.trim()===name.trim());if(!gs.length)return'';let w=0,l=0;gs.forEach(g=>{const r=result(g);if(r==='W')w++;else if(r==='L')l++});return`상대 전적 ${gs.length}경기 · ${w}승 ${l}패${gs.length-w-l?' '+(gs.length-w-l)+'무':''}`}
function gameForm(gid){
 const g=gid?G(gid):{date:today(),type:'tourn',title:'',opp:'',venue:'',zones:true,qCount:4,qLen:'',clockOn:false};
 const opps=[...new Set(DB.games.map(x=>x.opp.trim()).filter(Boolean))];
 openModal(`<h3>${gid?'경기 정보 수정':'새 경기 · 1/2 기본 정보'}</h3>

 <datalist id="oppList">${opps.map(o=>`<option value="${esc(o)}">`).join('')}</datalist><div class="hint" id="oppRec" style="margin-top:4px">${g.opp?oppRecord(g.opp):''}</div>

 <label class="f">대회명 / 메모</label><input id="fTitle" value="${esc(g.title)}" placeholder="예: 가을리그 4R">
 <label class="f">장소</label><input id="fVenue" value="${esc(g.venue)}">
 <label class="f" style="display:flex;gap:8px;align-items:center"><input id="fZones" type="checkbox" style="width:auto" ${g.zones?'checked':''}> 슛 위치(코트 구역)도 기록 — 대회·영상 리뷰용</label>
 <div class="row" style="margin-top:16px"><button class="btn pri" onclick="saveGame('${gid||''}')">${gid?'저장':'다음 · 스타팅 5 고르기'}</button><button class="btn" onclick="closeModal()">취소</button></div>`);
}
function saveGame(gid){
 const f=id=>document.getElementById(id);const opp=f('fOpp').value.trim();if(!opp){toast('상대팀 이름을 입력해 주세요');return}
 const data={date:f('fDate').value||today(),type:f('fType').value,opp,title:f('fTitle').value.trim(),venue:f('fVenue').value.trim(),zones:f('fZones').checked,qCount:+f('fQc').value,qLen:f('fQl').value?+f('fQl').value:'',clockOn:!!(gid&&G(gid)&&G(gid).clockOn)};
 if(gid){Object.assign(G(gid),data);save();closeModal();render();return}
 const g={id:uid(),...data,events:[],lineup:{},court:[],curQ:1,pending:true,status:'live',clk:{}};DB.games.push(g);save();closeModal();openLive(g.id);

function bindDrag(){
 const area=document.getElementById('lineupArea');if(!area)return;let st=null;
 const targetAt=(x,y)=>{const el=document.elementFromPoint(x,y);if(!el)return null;return el.closest('.slot')||el.closest('.bench')};
 const clearOver=()=>area.querySelectorAll('.over').forEach(e=>e.classList.remove('over'));
 area.onpointerdown=e=>{const c=e.target.closest('.chip');if(!c)return;st={c,pid:c.dataset.pid,from:c.dataset.where,x:e.clientX,y:e.clientY,drag:false,ghost:null};try{c.setPointerCapture(e.pointerId)}catch(_){}};
 area.onpointermove=e=>{if(!st)return;if(!st.drag&&Math.hypot(e.clientX-st.x,e.clientY-st.y)>8){st.drag=true;const gh=st.c.cloneNode(true);gh.classList.add('ghostchip');gh.style.width=st.c.offsetWidth+'px';document.body.appendChild(gh);st.ghost=gh;st.c.style.opacity='.35'}
  if(st.drag){st.ghost.style.left=e.clientX+'px';st.ghost.style.top=e.clientY+'px';clearOver();const t=targetAt(e.clientX,e.clientY);if(t)t.classList.add('over')}};
 const end=e=>{if(!st)return;const s=st;st=null;clearOver();if(s.ghost)s.ghost.remove();s.c.style.opacity='';
  if(!s.drag){tapChip(s.pid,s.from);return}
  const t=e.type==='pointercancel'?null:targetAt(e.clientX,e.clientY);if(!t)return;
  if(t.classList.contains('slot'))dropSlot(s.pid,s.from,+t.dataset.slot);else if(t.classList.contains('bench')&&s.from==='court')doSub(s.pid,null);};
 area.onpointerup=end;area.onpointercancel=end;
}
function tapChip(pid,from){
 const g=curG(),L=S.live;
 if(g.pending){if(from==='court'){g.court=g.court.filter(x=>x!==pid)}else{if(g.court.length>=5){toast('5명 꽉 찼어요 — 코트 선수를 탭해서 빼주세요');return}if(fouledOut(g,pid)){toast('파울 퇴장 선수예요');return}g.court.push(pid)}save();render();return}
 if(from==='court'){L.sel=L.sel===pid?null:pid;render();return}
 const selOn=L.sel&&g.court.includes(L.sel);
 if(selOn){doSub(L.sel,pid);return}
 if(g.court.length<5){doSub(null,pid);return}
 toast('교체: 코트 선수 탭 → 벤치 선수 탭 (또는 끌어놓기)');
}
function fouledOut(g,pid){return pStat(g,pid).pf>=FOUL_OUT}
function dropSlot(pid,from,i){
 const g=curG();const occ=g.court[i];
 if(from==='court'){const j=g.court.indexOf(pid);if(occ&&j>=0){g.court[j]=occ;g.court[i]=pid;save();render()}return}
 if(occ)doSub(occ,pid,i);else doSub(null,pid);
}
function doSub(outId,inId,idx){
 const g=curG(),L=S.live;
 if(inId&&fouledOut(g,inId)){toast('파울 퇴장 선수는 투입할 수 없어요');return}
 if(g.pending){if(outId){const k=g.court.indexOf(outId);if(inId)g.court[k]=inId;else g.court.splice(k,1)}else if(inId&&g.court.length<5)g.court.push(inId);save();render();return}
 if(!outId&&g.court.length>=5){toast('5명 꽉 찼어요');return}
 if(outId){const k=idx!=null?idx:g.court.indexOf(outId);if(inId)g.court[k]=inId;else g.court.splice(k,1)}else g.court.push(inId);
 if(inId)addLineup(g,g.curQ,inId);
 g.events.push(mkEv(g,'SUB',inId,{out:outId}));
 if(L.sel===outId)L.sel=inId||null;L.ast=null;save();
 toast((inId?'IN '+P(inId).name:'')+(inId&&outId?' · ':'')+(outId?'OUT '+P(outId).name:''));render();
}
function startQ(){const g=curG();if(g.court.length<5&&!confirm(`코트에 ${g.court.length}명이에요. 이대로 시작할까요?`))return;
 g.pending=false;g.court.forEach(id=>addLineup(g,g.curQ,id));g.events.push(mkEv(g,'QSTART',null));S.live.sel=null;save();toast(qName(g.curQ,g)+' 시작');render()}
function endQ(){
 const g=curG(),q=g.curQ;clkStop(g);
 g.events.push(mkEv(g,'QEND',null));save();
 const[qa,qb]=qScore(g,q),[a,b]=score(g);const top=g.court.concat(Object.values(g.lineup[q]||[])).filter((v,i,s)=>s.indexOf(v)===i).map(id=>({p:P(id),pts:g.events.filter(e=>e.q===q&&e.pid===id&&EV[e.type].pts&&!EV[e.type].opp).reduce((s,e)=>s+EV[e.type].pts,0)})).filter(x=>x.p).sort((x,y)=>y.pts-x.pts)[0];
 const last=q>=(g.qCount||4);
 openModal(`<h3>${qName(q,g)} 종료</h3>
 <div class="score" style="margin:8px 0"><div class="t"><small>${qName(q,g)}</small><b style="font-size:26px">${qa} : ${qb}</b></div><div class="vs">|</div><div class="t"><small>누적</small><b style="font-size:26px">${a} : ${b}</b></div></div>
 <div class="row" style="gap:16px;margin-bottom:12px"><div><div class="hint">쿼터 득점 1위</div><b>${top&&top.pts?esc(top.p.name)+' '+top.pts+'점':'–'}</b></div><div><div class="hint">팀파울 (NST / 상대)</div><b>${g.events.filter(e=>e.q===q&&e.type==='PF').length} / ${oppTF(g,q)}</b></div></div>
 <div class="row">${last?`<button class="btn pri" onclick="finishGame()">경기 종료</button><button class="btn" onclick="nextQ()">연장전 (OT)</button>`:`<button class="btn pri" onclick="nextQ()">${qName(q+1,g)} 라인업 정하기</button>`}<button class="btn" onclick="undoQEnd()">취소</button></div>`);
}
function undoQEnd(){const g=curG();const e=g.events[g.events.length-1];if(e&&e.type==='QEND')g.events.pop();save();closeModal();render()}
function nextQ(){const g=curG();g.curQ=(g.curQ||1)+1;g.pending=true;S.live.sel=null;save();closeModal();render();window.scrollTo(0,0)}
function finishGame(){const g=curG();g.status='done';g.pending=false;save();closeModal();S.gtab='sheet';go('game',g.id);toast('경기 종료 — 기록지 저장됨')}
function recTO(){const g=curG();clkStop(g);g.events.push(mkEv(g,'TO',null));save();toast('타임아웃');render()}
function rec(type){
 const g=curG(),d=EV[type],L=S.live;
 if(g.pending){toast(qName(g.curQ,g)+' 시작을 먼저 눌러주세요');return}
 if(!d.opp&&!L.sel){toast('코트 선수를 먼저 탭하세요');return}
 const ev=mkEv(g,type,d.opp?null:L.sel);
 if(!d.opp)addLineup(g,ev.q,L.sel);
 if(g.zones&&d.shot){zonePicker(ev);return}
 commit(ev);
}
function commit(ev){const g=curG(),d=EV[ev.type];g.events.push(ev);save();S.live.ast=(!d.opp&&d.shot&&d.made)?ev.pid:null;
 let msg=(ev.pid?P(ev.pid).name+' · ':'')+d.n;if(ev.type==='PF'){const f=pStat(g,ev.pid).pf;if(f>=FOUL_OUT)msg+=' — 파울 퇴장! 교체하세요';else if(f===FOUL_OUT-1)msg+=' — 파울 4개 주의'}
 toast(msg);render()}
function recAst(pid){const g=curG();const ev=mkEv(g,'AST',pid);addLineup(g,ev.q,pid);g.events.push(ev);S.live.ast=null;save();toast(P(pid).name+' · 어시스트');render()}
function undo(){const g=curG();if(!g.events.length)return;const e=g.events.pop();
 if(e.type==='SUB'){const k=e.pid?g.court.indexOf(e.pid):-1;if(e.pid&&e.out&&k>=0)g.court[k]=e.out;else if(e.pid&&k>=0)g.court.splice(k,1);else if(e.out)g.court.push(e.out);if(e.pid){const used=g.events.some(x=>x.q===e.q&&(x.pid===e.pid||(x.type==='QSTART'&&(x.court||[]).includes(e.pid))));if(!used&&g.lineup[e.q])g.lineup[e.q]=g.lineup[e.q].filter(x=>x!==e.pid)}}
 if(e.type==='QSTART')g.pending=true;
 save();toast('취소: '+(e.type==='SUB'?'교체':EV[e.type].n));render()}
function delEv(id){const g=curG();const e=g.events.find(x=>x.id===id);if(e&&['SUB','QSTART'].includes(e.type)&&!confirm('진행 기록을 지워도 코트 배치는 그대로예요. 지울까요?'))return;g.events=g.events.filter(e=>e.id!==id);save();render()}

 rows.sort((a,b)=>k==='name'?a.p.name.localeCompare(b.p.name)*dir:((a.s[k]??-1e9)-(b.s[k]??-1e9))*dir);

 if(rad)mkChart('chRad',{radar:{indicator:AX.map(([k,n])=>({name:n,max:100})),radius:'66%',axisName:{color:css('--ink'),fontWeight:700},splitLine:{lineStyle:{color:css('--line')}},splitArea:{show:false}},series:[{type:'radar',data:[{value:AX.map(([k])=>rad[k].score),areaStyle:{color:'rgba(185,28,28,.22)'},lineStyle:{color:'#B91C1C',width:2},itemStyle:{color:'#B91C1C'}}]}]});

function axRaw(k,v){if(v==null)return'시도 부족';if(k==='shoot')return'TS '+(v*100).toFixed(0)+'%';const u={score:'점',reb:'개',play:'',def:'개',impact:''}[k];return(v>0&&k==='impact'?'+':'')+v.toFixed(2)+u+'/Q'}

/* ============ 코트 분석 ============ */
function zoneAgg(games,side,pid){
 const z={};ZK.forEach(k=>z[k]={a:0,m:0,pts:0});const tot={a:0,m:0,pts:0};let untag=0;
 for(const g of games)for(const e of g.events){const d=EV[e.type];if(!d||!d.shot)continue;if((side==='off')===!!d.opp)continue;if(pid&&e.pid!==pid)continue;
  if(!e.zone){untag++;continue}const r=z[e.zone];r.a++;tot.a++;if(d.made){r.m++;tot.m++;r.pts+=d.pts;tot.pts+=d.pts}}
 return{z,tot,untag};
}
function setAna(k,v){S.ana[k]=v;render()}
function vCourt(v){
 const A=S.ana;const zgames=DB.games.filter(g=>g.zones).sort((a,b)=>a.date<b.date?1:-1);
 const games=A.game!=='all'?DB.games.filter(g=>g.id===A.game):zgames.filter(g=>A.scope==='all'||g.type===A.scope);
 const{z,tot,untag}=zoneAgg(games,A.side,null);const off=A.side==='off';
 const MET=off?{share:'시도 비중',fg:'성공률',pts:'득점 비중'}:{share:'상대 시도 비중',fg:'허용 성공률',pts:'실점 비중'};
 const val=r=>A.metric==='share'?(tot.a?r.a/tot.a:0):A.metric==='fg'?(r.a?r.m/r.a:null):(tot.pts?r.pts/tot.pts:0);
 const vals={},labels={};let mx=0;ZK.forEach(k=>{const x=val(z[k]);if(x!=null)mx=Math.max(mx,x)});
 ZK.forEach(k=>{const r=z[k],x=val(r);if(!r.a&&A.metric==='fg')return;vals[k]=A.metric==='fg'?x/.7:(mx?x/mx:0);labels[k]=(x==null?'–':Math.round(x*100)+'%')+'\n'+r.m+'/'+r.a});
 const grp={};Object.keys(GRP).forEach(g=>grp[g]={a:0,m:0,pts:0});ZK.forEach(k=>{const G_=grp[ZONES[k].g];G_.a+=z[k].a;G_.m+=z[k].m;G_.pts+=z[k].pts});
 const dots=A.dots?games.flatMap(g=>g.events.filter(e=>e.x!=null&&EV[e.type].shot&&(off!==!!EV[e.type].opp)).map(e=>({x:e.x,y:e.y,made:EV[e.type].made}))):null;
 const ranked=ZK.filter(k=>z[k].a).sort((a,b)=>z[b].pts-z[a].pts);
 const enough=ZK.filter(k=>z[k].a>=5);const best=enough.slice().sort((a,b)=>z[b].m/z[b].a-z[a].m/z[a].a);
 const ins=[];
 if(ranked.length){const t=ranked[0];ins.push(off?`득점이 가장 많이 나온 곳은 <b>${ZONES[t].n}</b> — 전체 득점의 ${Math.round(z[t].pts/tot.pts*100)}%`:`가장 많이 실점한 곳은 <b>${ZONES[t].n}</b> — 전체 실점의 ${Math.round(z[t].pts/tot.pts*100)}%`)}
 if(best.length>1){const hi=best[0],lo=best[best.length-1];ins.push(off?`효율 최고 <b>${ZONES[hi].n}</b> ${Math.round(z[hi].m/z[hi].a*100)}% · 최저 <b>${ZONES[lo].n}</b> ${Math.round(z[lo].m/z[lo].a*100)}% (시도 5회 이상)`:`상대 성공률 최고 <b>${ZONES[hi].n}</b> ${Math.round(z[hi].m/z[hi].a*100)}% — 여기가 수비 구멍 · 최저 <b>${ZONES[lo].n}</b> ${Math.round(z[lo].m/z[lo].a*100)}%`)}
 if(tot.a){const p3=grp.three.a/tot.a;ins.push(`${off?'우리':'상대'} 슛 구성: 골밑 ${Math.round(grp.paint.a/tot.a*100)}% · 미드 ${Math.round(grp.mid.a/tot.a*100)}% · 3점 ${Math.round(p3*100)}%`)}
 v.innerHTML=`<h2>코트 분석 <span class="hint">구역 기록된 경기 기준</span></h2>
 <div class="row" style="margin-bottom:8px">${seg(A.side,{off:'공격 (우리 슛)',def:'수비 (상대 슛)'},"(k=>setAna('side',k))")}${seg(A.metric,MET,"(k=>setAna('metric',k))")}</div>
 <div class="row" style="margin-bottom:12px"><select style="width:auto" onchange="setAna('game',this.value)"><option value="all">${'구역 기록 경기 전체'} (${zgames.length})</option>${zgames.map(g=>`<option value="${g.id}" ${A.game===g.id?'selected':''}>${g.date} vs ${esc(g.opp)}</option>`).join('')}</select>
 ${A.game==='all'?seg(A.scope,{tourn:'대회만',all:'전체'},"(k=>setAna('scope',k))"):''}<label class="hint" style="display:flex;gap:4px;align-items:center"><input type="checkbox" style="width:auto" ${A.dots?'checked':''} onchange="setAna('dots',this.checked)">슛 위치 점 표시</label></div>
 <div class="grid g2">
  <div class="card"><div class="court-wrap"><canvas id="acv"></canvas></div><p class="note">위=골대 · 색 진할수록 ${MET[A.metric]}↑ · 숫자 아래=성공/시도${untag?` · 구역 미기록 슛 ${untag}개 제외`:''}</p></div>
  <div>
   <div class="kpis" style="grid-template-columns:repeat(3,1fr)">${Object.entries(GRP).map(([g,n])=>`<div class="kpi"><div class="l">${n}</div><div class="v" style="font-size:19px">${tot.a?Math.round(grp[g].a/tot.a*100):0}%</div><div class="s">성공 ${grp[g].a?Math.round(grp[g].m/grp[g].a*100):0}% · ${off?'득점':'실점'} ${grp[g].pts}</div></div>`).join('')}</div>
   <div class="card"><h3>한 줄 요약</h3>${ins.map(x=>`<div style="padding:4px 0">· ${x}</div>`).join('')||'<div class="note">데이터가 없어요</div>'}</div>
   <div class="card"><h3>구역별 ${off?'득점':'실점'}</h3><div id="chZone" class="chart" style="height:320px"></div></div>
  </div>
 </div>`;
 drawCourt(document.getElementById('acv'),{values:vals,labels,dots,color:off?[185,28,28]:[63,63,70]});
 const order=ZK.slice().sort((a,b)=>z[a].pts-z[b].pts);
 mkChart('chZone',{grid:{left:110,right:40,top:6,bottom:20},tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},xAxis:{type:'value'},yAxis:{type:'category',data:order.map(k=>ZONES[k].n)},
  series:[{type:'bar',data:order.map(k=>z[k].pts),itemStyle:{color:off?'#B91C1C':'#3F3F46'},label:{show:true,position:'right'},barMaxWidth:18}]});
}

function exportJSON(){if(window.NSTApp){toast(NSTApp.saveText('NST_백업_'+today().replace(/-/g,'')+'.json',JSON.stringify(DB,null,1)));return}const b=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='NST_백업_'+today().replace(/-/g,'')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.players||!d.games)throw 0;if(!confirm('현재 데이터를 백업 파일로 덮어쓸까요?'))return;DB=d;save();closeModal();go('home');toast('가져오기 완료')}catch(e){toast('올바른 백업 파일이 아니에요')}};r.readAsText(f);inp.value=''}
function resetAll(){if(!confirm('모든 기록을 지우고 처음 상태(샘플)로 돌릴까요? 먼저 백업을 권장해요.'))return;DB=seed();save();closeModal();go('home')}

save();render();
</script>
</body>
